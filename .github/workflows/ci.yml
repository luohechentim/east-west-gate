name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          printf 'A sufficiently detailed proposal for the offline review smoke test.\n' > /tmp/double-gate-plan.md
          double-gate review /tmp/double-gate-plan.md --risk low --offline --root .
          double-gate gates /tmp/double-gate-plan.md --risk low --context examples/gates-context.json --fail-on-failure
          double-gate guard /tmp/double-gate-plan.md --root .

  package:
    name: Build and inspect distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          double-gate catalog
      - uses: actions/upload-artifact@v7
        with:
          name: double-gate-distributions
          path: dist/
          if-no-files-found: error
